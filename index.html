<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>人像構圖相機</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1c20;--line:#30343b;--text:#f4f4f5;--muted:#a3a7af;--yellow:#ffd34d;--blue:#5ee0ff;--green:#4ade80}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}button{font:inherit;color:inherit;touch-action:manipulation}header{padding:calc(10px + env(safe-area-inset-top)) 16px 8px}header h1{font-size:19px;margin:0}header p{font-size:12px;color:var(--muted);margin:2px 0 0}.app{max-width:680px;margin:auto;padding:0 12px calc(22px + env(safe-area-inset-bottom))}
/* The camera frame has a fixed aspect ratio so the SVG guides and the video crop use the same coordinate space. */
.camera{position:relative;width:min(100%,calc((100svh - 260px)*.75));height:auto;aspect-ratio:3/4;min-height:0;margin:0 auto;background:#050505;border:1px solid #292c31;border-radius:20px;overflow:hidden;isolation:isolate}
.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#070707;transform-origin:center}.veil{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;background:linear-gradient(180deg,#394552,#293038 55%,#191c1e);z-index:4}.veil[hidden]{display:none}.veil p{margin:0;max-width:300px;color:#e5e7eb;font-size:14px}.primary{border:0;border-radius:999px;background:var(--yellow);color:#171717;padding:14px 26px;font-weight:800;font-size:17px;box-shadow:0 5px 22px #0007}.sub{font-size:12px!important;color:#c3c6cb!important}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.gridline{stroke:#fff9;stroke-width:1}.silhouette{fill:#ffd34d18;stroke:var(--yellow);stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 1px 3px #000)}.hline{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:9 5}.label{position:absolute;z-index:2;left:50%;top:12px;transform:translateX(-50%);max-width:90%;padding:6px 11px;border-radius:999px;background:#000a;text-align:center;font-size:12px;font-weight:700;white-space:nowrap}.pitch{position:absolute;right:9px;top:10px;z-index:2;padding:5px 9px;border-radius:999px;background:#0009;font-size:12px}.camera-status{padding:8px 4px 2px;text-align:center;font-size:14px;font-weight:700;color:var(--yellow)}.tip{margin:2px 4px 12px;text-align:center;font-size:12px;color:var(--muted);min-height:18px}.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 12px}.tool{min-width:48px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:650}.tool.active{border-color:var(--yellow);color:var(--yellow)}.shutter{width:68px;height:68px;border:4px solid white;border-radius:50%;background:white;box-shadow:inset 0 0 0 4px #111317}.shutter:disabled{opacity:.35}.shutter:active{transform:scale(.94)}.secondary{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.secondary button{min-height:42px;padding:8px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 7px}.section-head strong{font-size:14px}.section-head span{font-size:11px;color:var(--muted)}.templates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.template{flex:0 0 150px;min-height:68px;padding:9px 11px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);scroll-snap-align:start}.template b{display:block;font-size:14px}.template span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.3}.template.selected{border:1.5px solid var(--yellow);background:#292516}.shots{display:flex;gap:8px;overflow:auto;padding:4px 2px 8px}.shots:empty{display:none}.shots a{flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}.shots img{display:block;height:74px;width:auto}.help{margin:12px 2px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:12px;color:var(--muted)}.help b{color:var(--text)}.help p{margin:4px 0}.error{color:#ffb4a9!important}
.ratio916 .camera{width:min(100%,calc((100svh - 260px)*.5625));height:auto;aspect-ratio:9/16}
@media(max-height:700px){.camera{width:min(100%,calc((100svh - 190px)*.75))}.ratio916 .camera{width:min(100%,calc((100svh - 190px)*.5625))}}
@media(min-width:700px){.app{padding-left:20px;padding-right:20px}.camera{width:min(100%,510px,calc((100svh - 210px)*.75))}.ratio916 .camera{width:min(100%,405px,calc((100svh - 210px)*.5625))}}
</style>
</head>
<body>
<header><h1>人像構圖相機</h1><p>選構圖模板，對準輪廓，再按快門。</p></header>
<main class="app" id="app">
  <div class="camera" id="camera">
    <video id="video" autoplay muted playsinline></video>
    <svg class="overlay" id="overlay" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="label" id="guideLabel">半身照・把人對準黃色輪廓</div>
    <div class="pitch" id="zoomLabel">1×</div>
    <div class="veil" id="veil"><button class="primary" id="start">開啟相機</button><p id="status">點按按鈕並允許 Chrome 使用相機。</p><p class="sub">瀏覽器不允許網頁自行啟動相機，需由你點按後授權。</p></div>
  </div>
  <div class="camera-status" id="selectedName">半身照</div>
  <p class="tip" id="tip">眼睛靠上方第一條線，頭頂留白，畫面底到腰。</p>
  <div class="toolbar"><button class="tool" id="zoomOut" aria-label="縮小倍率">−</button><button class="shutter" id="shutter" aria-label="拍照" disabled></button><button class="tool" id="zoomIn" aria-label="放大倍率">＋</button></div>
  <div class="secondary"><button id="switch" type="button">切換鏡頭</button><button id="ratio" type="button" aria-pressed="false">改為 9:16</button><button id="grid" type="button" class="active" aria-pressed="true">九宮格</button></div>
  <div class="section-head"><strong>構圖模板</strong><span>左右滑動選擇</span></div>
  <div class="templates" id="templates" aria-label="構圖模板"></div>
  <div class="shots" id="shots" aria-label="已拍照片"></div>
  <aside class="help"><p><b>相機無法開啟？</b></p><p id="helpText">請確認網址是 https://yujie0923.github.io/gfcam/，並在 Chrome 網址列的網站設定中允許相機。完成後重新整��再點「開啟相機」。</p><p>照片只在本機處理；不會上傳。</p></aside>
</main>
<script>
(()=>{'use strict';
const templates=[
 {name:'半身照',note:'眼睛靠上線・底到腰',tip:'眼睛靠上方第一條線，頭頂留白，畫面底到腰。',x:.5,top:.17,bottom:.77,w:.43,horizon:.34},
 {name:'大片感半身',note:'人小景大・放左下',tip:'人物放左下四格，其他空間留給景色。',x:.30,top:.40,bottom:.96,w:.36,horizon:.45},
 {name:'膝上照',note:'頭頂留一格・底到膝',tip:'頭頂留一格，畫面底線靠近膝蓋上緣。',x:.5,top:.15,bottom:.95,w:.42,horizon:.42},
 {name:'全身照',note:'胸口高度・腳貼底',tip:'手機在胸口高度，腳尖靠近畫面最下緣。',x:.5,top:.08,bottom:.98,w:.42,horizon:.43},
 {name:'四六分全身',note:'人物靠四六分線',tip:'人物站在四六分線附近，腳接近底部。',x:.40,top:.08,bottom:.98,w:.42,horizon:.43},
 {name:'更高挑全身',note:'倒拿手機・腳放底部',tip:'手機倒過來拿，腳放最下方，上方只留少量空間。',x:.5,top:.03,bottom:.99,w:.39,horizon:.50},
 {name:'超廣角人＋景',note:'胸口高度・腳勿貼底',tip:'用手機內建相機切 0.5×；腳不要貼近畫面底部。',x:.5,top:.12,bottom:.84,w:.42,horizon:.43},
 {name:'坐姿顯腿長',note:'坐前緣・腿往前伸',tip:'只坐椅子前緣，腿往側前方伸，避免切到關節。',x:.43,top:.08,bottom:.98,w:.47,horizon:.45},
 {name:'氛圍感三分法',note:'人站三分線・留背景',tip:'人物站在左右三分線，另一側留給背景。',x:.33,top:.06,bottom:.98,w:.40,horizon:.43}
];
const $=s=>document.querySelector(s),video=$('#video'),veil=$('#veil'),overlay=$('#overlay');let stream=null,track=null,facing='environment',zoom=1,gridOn=true,ratio916=false,selected=0;
function makeTemplates(){const box=$('#templates');templates.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='template'+(i===0?' selected':'');b.innerHTML=`<b>${t.name}</b><span>${t.note}</span>`;b.addEventListener('click',()=>select(i));box.append(b)})}
function select(i){selected=i;const t=templates[i];document.querySelectorAll('.template').forEach((b,j)=>b.classList.toggle('selected',j===i));$('#selectedName').textContent=t.name;$('#tip').textContent=t.tip;$('#guideLabel').textContent=t.name+'・對準黃色輪廓';draw()}
function draw(){const t=templates[selected],H=ratio916?300*16/9:400;overlay.setAttribute('viewBox',`0 0 300 ${H}`);overlay.replaceChildren();if(gridOn){for(const x of [100,200])overlay.insertAdjacentHTML('beforeend',`<path class="gridline" d="M${x} 0v${H}"/>`);for(const y of [H/3,H*2/3])overlay.insertAdjacentHTML('beforeend',`<path class="gridline" d="M0 ${y}h300"/>`)}const top=t.top*H,bottom=t.bottom*H,w=t.w*300,cx=t.x*300,h=bottom-top,headW=w*.28,headH=h*.13,headY=top+h*.06,shoulderY=top+h*.22,hipY=top+h*.59;overlay.insertAdjacentHTML('beforeend',`<path class="hline" d="M0 ${t.horizon*H}h300"/><g class="silhouette"><ellipse cx="${cx}" cy="${headY+headH/2}" rx="${headW/2}" ry="${headH/2}"/><path d="M${cx-headW*.5} ${shoulderY} Q${cx} ${shoulderY-h*.04} ${cx+headW*.5} ${shoulderY} L${cx+w*.34} ${hipY} L${cx+w*.22} ${hipY+4} L${cx+w*.12} ${bottom} L${cx+w*.02} ${bottom} L${cx} ${hipY+h*.12} L${cx-w*.02} ${bottom} L${cx-w*.12} ${bottom} L${cx-w*.22} ${hipY+4} L${cx-w*.34} ${hipY} Z"/></g>`)}
function showMessage(text,error=false){$('#status').textContent=text;$('#status').classList.toggle('error',error);veil.hidden=false}
async function startCamera(){if(!window.isSecureContext){showMessage('相機需要 HTTPS 安全連線。請用 GitHub Pages 的 https 網址開啟。',true);return}if(!navigator.mediaDevices?.getUserMedia){showMessage('此瀏覽器無法使用網頁相機，請用最新版 Chrome 開啟。',true);return}$('#start').disabled=true;$('#start').textContent='正在開啟…';try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;await video.play();track=stream.getVideoTracks()[0];veil.hidden=true;$('#shutter').disabled=false;setZoom(1)}catch(e){const text=e.name==='NotAllowedError'?'相機權限未允許。點網址列左側的網站設定，將「相機」改為允許，再重新整理。':e.name==='NotFoundError'?'找不到可用的相機。':'相機啟動失敗：'+(e.message||e);showMessage(text,true)}finally{$('#start').disabled=false;$('#start').textContent='開啟相機'}}
function setZoom(z){zoom=Math.max(1,Math.min(3,z));if(track?.getCapabilities){const c=track.getCapabilities();if(c.zoom&&zoom>=c.zoom.min&&zoom<=c.zoom.max)track.applyConstraints({advanced:[{zoom}]}).catch(()=>{})}video.style.transform=`${facing==='user'?'scaleX(-1) ':''}scale(${zoom})`;$('#zoomLabel').textContent=zoom+'×'}
async function switchCamera(){facing=facing==='environment'?'user':'environment';if(stream)await startCamera()}
function shoot(){if(!stream||!video.videoWidth)return;const vw=video.videoWidth,vh=video.videoHeight,a=ratio916?9/16:3/4;let cw,ch;if(vw/vh>a){ch=vh;cw=vh*a}else{cw=vw;ch=vw/a}cw/=zoom;ch/=zoom;const sx=(vw-cw)/2,sy=(vh-ch)/2,c=document.createElement('canvas');c.width=Math.round(cw);c.height=Math.round(ch);const ctx=c.getContext('2d');if(facing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1)}ctx.drawImage(video,sx,sy,cw,ch,0,0,c.width,c.height);c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),d=new Date(),a=document.createElement('a');a.href=url;a.download=`人像構圖_${d.getTime()}.jpg`;const img=document.createElement('img');img.src=url;img.alt='拍攝照片，點擊下載';a.append(img);$('#shots').prepend(a);a.addEventListener('click',()=>setTimeout(()=>URL.revokeObjectURL(url),60000),{once:true})},'image/jpeg',.92)}
$('#start').addEventListener('click',startCamera);$('#switch').addEventListener('click',switchCamera);$('#shutter').addEventListener('click',shoot);$('#zoomOut').addEventListener('click',()=>setZoom(zoom-.5));$('#zoomIn').addEventListener('click',()=>setZoom(zoom+.5));$('#ratio').addEventListener('click',e=>{ratio916=!ratio916;$('#app').classList.toggle('ratio916',ratio916);e.currentTarget.textContent=ratio916?'改為 3:4':'改為 9:16';e.currentTarget.setAttribute('aria-pressed',ratio916);draw()});$('#grid').addEventListener('click',e=>{gridOn=!gridOn;e.currentTarget.classList.toggle('active',gridOn);e.currentTarget.setAttribute('aria-pressed',gridOn);draw()});makeTemplates();select(0);
})();
</script>
</body>
</html>
